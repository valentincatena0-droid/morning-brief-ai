# Source registry. Every source has a credibility profile (priors you can edit).
#
# trust factors (0..1):
#   reputation   editorial standards / reputation
#   accuracy     track record of accuracy (few retractions)
#   corrections  transparency about corrections
#   primary      1 if the publisher IS the primary source (government, agency, journal)
# trust = 0.40*reputation + 0.25*accuracy + 0.10*corrections + 0.25*primary  (see pipeline/verify.py)
#
# owner: sources sharing an owner/wire are NOT independent (e.g. an AP story syndicated elsewhere).
# kind:  news | wire | official | science | finance_official
# feeds: list of {url, category, region}. First working feed wins per entry; all feeds are polled,
#        a failing feed is skipped and reported in health.
# headline_only: true when the feed gives no usable summary (e.g. Google News search RSS).

sources:
  bbc:
    name: BBC News
    kind: news
    owner: bbc
    reputation: 0.90
    accuracy: 0.88
    corrections: 0.90
    primary: 0
    feeds:
